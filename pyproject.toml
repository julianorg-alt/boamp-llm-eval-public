[project]
name = "boamp-llm-eval"
version = "0.1.0"
description = "Évaluation reproductible de modèles Claude sur l'extraction structurée d'avis BOAMP"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = ["pytest==9.2.0", "ruff==0.17.5"]

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/boamp_eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["E501"]  # lignes longues : le formateur gère le code, pas les chaînes

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
